<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CYFORM PHONE SCANNER</title>

  <!-- BARCODE SCANNER -->
  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
    }


    /* ==========================================
       HEADER
    ========================================== */

    .header {
      background: #f58220;
      color: white;
      padding: 18px 10px;
      font-size: 24px;
      font-weight: bold;
    }


    /* ==========================================
       CONTAINER
    ========================================== */

    .container {
      width: 100%;
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }


    /* ==========================================
       CAMERA
    ========================================== */

    #reader {
      width: 100%;
      margin-top: 20px;
    }


    #reader video {
      width: 100% !important;
      border-radius: 12px;
    }


    /* ==========================================
       STATUS
    ========================================== */

    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #eeeeee;
      font-size: 18px;
      font-weight: bold;
    }


    .success {
      background: #d9ead3;
      color: #166534;
    }


    .error {
      background: #f4cccc;
      color: #990000;
    }


    .processing {
      background: #fff2cc;
      color: #7f6000;
    }


    /* ==========================================
       ORDER
    ========================================== */

    .order {
      font-size: 28px;
      font-weight: bold;
      margin-top: 15px;
      word-break: break-all;
    }


    /* ==========================================
       BUTTON
    ========================================== */

    button {
      margin-top: 20px;
      width: 100%;
      padding: 17px 25px;
      border: none;
      border-radius: 10px;
      background: #f58220;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }


    button:active {
      transform: scale(0.98);
    }


    button.stop {
      background: #555555;
    }


    /* ==========================================
       RESULT
    ========================================== */

    #result {
      margin-top: 15px;
    }


    .small {
      margin-top: 10px;
      color: #666666;
      font-size: 14px;
    }

  </style>

</head>


<body>


  <!-- ==========================================
       HEADER
  ========================================== -->

  <div class="header">
    CYFORM PHONE SCANNER
  </div>


  <div class="container">


    <!-- ========================================
         CAMERA
    ======================================== -->

    <div id="reader"></div>


    <!-- ========================================
         STATUS
    ======================================== -->

    <div
      id="status"
      class="status"
    >
      READY TO SCAN
    </div>


    <!-- ========================================
         RESULT
    ======================================== -->

    <div id="result"></div>


    <!-- ========================================
         BUTTON
    ======================================== -->

    <button
      id="startButton"
      onclick="startScanner()"
    >
      📷 START CAMERA
    </button>


    <div class="small">
      Scan barcode ORDER ID
    </div>


  </div>


<script>


  // ==================================================
  // GOOGLE APPS SCRIPT BACKEND
  // ==================================================

  const BACKEND_URL =
    "https://script.google.com/macros/s/AKfycbw9smho6W_Qr3jrxHdR_M1faez_FOPkwXTL9UdX7da_WlplzJGIw2uPDIVQRoiF-qIDiQ/exec";


  // ==================================================
  // VARIABLES
  // ==================================================

  let scanner = null;

  let scanning = false;

  let processing = false;


  // ==================================================
  // ELEMENTS
  // ==================================================

  const statusElement =
    document.getElementById("status");

  const resultElement =
    document.getElementById("result");

  const startButton =
    document.getElementById("startButton");


  // ==================================================
  // STATUS FUNCTION
  // ==================================================

  function setStatus(
    message,
    type = ""
  ) {

    statusElement.className =
      "status " + type;

    statusElement.innerHTML =
      message;

  }


  // ==================================================
  // START CAMERA
  // ==================================================

  function startScanner() {


    if (scanning) {

      return;

    }


    processing = false;


    resultElement.innerHTML =
      "";


    setStatus(
      "📷 CAMERA STARTING...",
      "processing"
    );


    startButton.innerText =
      "⏳ CAMERA STARTING...";


    startButton.disabled =
      true;


    // Create scanner

    scanner =
      new Html5Qrcode(
        "reader"
      );


    scanner.start(

      {
        facingMode: {
          ideal: "environment"
        }
      },


      {

        fps: 10,


        qrbox:
          function(
            viewfinderWidth,
            viewfinderHeight
          ) {

            return {

              width:
                Math.floor(
                  viewfinderWidth * 0.85
                ),

              height:
                Math.floor(
                  viewfinderHeight * 0.30
                )

            };

          },


        aspectRatio:
          1.7777778,


        disableFlip:
          false

      },


      onScanSuccess,


      onScanFailure

    )


    .then(

      function() {

        scanning =
          true;


        startButton.disabled =
          false;


        startButton.innerText =
          "⏹ STOP CAMERA";


        startButton.classList.add(
          "stop"
        );


        startButton.onclick =
          stopScanner;


        setStatus(
          "📷 CAMERA READY<br>Scan barcode ORDER ID"
        );

      }

    )


    .catch(

      function(error) {

        console.error(
          error
        );


        scanning =
          false;


        startButton.disabled =
          false;


        startButton.innerText =
          "📷 START CAMERA";


        startButton.classList.remove(
          "stop"
        );


        startButton.onclick =
          startScanner;


        setStatus(
          "❌ CAMERA ERROR",
          "error"
        );


        resultElement.innerHTML =
          "<div>" +
          String(error) +
          "</div>";

      }

    );

  }


  // ==================================================
  // STOP CAMERA
  // ==================================================

  function stopScanner() {


    if (
      !scanner ||
      !scanning
    ) {

      return;

    }


    scanner
      .stop()

      .then(

        function() {

          scanning =
            false;


          startButton.disabled =
            false;


          startButton.innerText =
            "📷 START CAMERA";


          startButton.classList.remove(
            "stop"
          );


          startButton.onclick =
            startScanner;


          setStatus(
            "CAMERA STOPPED"
          );

        }

      )

      .catch(

        function(error) {

          console.error(
            error
          );


          scanning =
            false;

        }

      );

  }


  // ==================================================
  // SCAN SUCCESS
  // ==================================================

  function onScanSuccess(
    decodedText,
    decodedResult
  ) {


    // Prevent duplicate scans

    if (processing) {

      return;

    }


    processing =
      true;


    // Get ORDER ID

    const orderId =
      String(
        decodedText || ""
      ).trim();


    if (!orderId) {

      processing =
        false;

      return;

    }


    console.log(
      "SCANNED ORDER:",
      orderId
    );


    // ================================================
    // SHOW ORDER
    // ================================================

    resultElement.innerHTML =

      "<div class='order'>" +
      orderId +
      "</div>";


    setStatus(
      "⏳ PROCESSING ORDER...",
      "processing"
    );


    // ================================================
    // STOP CAMERA
    // ================================================

    if (
      scanner &&
      scanning
    ) {

      scanner
        .stop()

        .then(

          function() {

            scanning =
              false;

          }

        )

        .catch(

          function() {

            scanning =
              false;

          }

        );

    }


    // ================================================
    // SEND TO GOOGLE APPS SCRIPT
    // ================================================

    sendToBackend(
      orderId
    );

  }


  // ==================================================
  // SEND ORDER TO BACKEND
  // ==================================================

  function sendToBackend(
    orderId
  ) {


    const url =

      BACKEND_URL +

      "?action=scan&orderId=" +

      encodeURIComponent(
        orderId
      );


    console.log(
      "BACKEND:",
      url
    );


    /*
     * Apps Script Web App navigation.
     *
     * Kita buka backend dalam tab baru.
     * Scanner page kekal.
     */

    const backendWindow =
      window.open(
        url,
        "_blank"
      );


    if (!backendWindow) {

      setStatus(
        "⚠️ BLOCKED BY BROWSER",
        "error"
      );


      resultElement.innerHTML +=

        "<div class='small'>" +
        "Allow popups untuk website ini." +
        "</div>";


      processing =
        false;


      return;

    }


    // ================================================
    // SHOW SUCCESS
    // ================================================

    setTimeout(

      function() {

        setStatus(
          "✅ SCAN SENT",
          "success"
        );


        resultElement.innerHTML +=

          "<div class='small'>" +
          "ORDER ID dihantar ke system." +
          "</div>";


        // Close backend tab

        try {

          backendWindow.close();

        }

        catch(e) {

          console.log(e);

        }


        // Reset selepas 1.5 saat

        setTimeout(

          function() {

            resetScanner();

          },

          1500

        );

      },

      1200

    );

  }


  // ==================================================
  // SCAN FAILURE
  // ==================================================

  function onScanFailure(
    errorMessage
  ) {

    /*
     * Jangan paparkan error.
     *
     * html5-qrcode akan panggil function ni
     * banyak kali ketika camera sedang mencari
     * barcode.
     */

  }


  // ==================================================
  // RESET
  // ==================================================

  function resetScanner() {


    processing =
      false;


    resultElement.innerHTML =
      "";


    setStatus(
      "READY TO SCAN"
    );


    startButton.disabled =
      false;


    startButton.innerText =
      "📷 START CAMERA";


    startButton.classList.remove(
      "stop"
    );


    startButton.onclick =
      startScanner;


    scanner =
      null;

  }


</script>

</body>

</html>
