<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CYFORM PHONE SCANNER</title>


  <!-- BARCODE SCANNER -->
  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      background: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
    }


    /* ==========================================
       HEADER
    ========================================== */

    .header {
      background: #f58220;
      color: white;
      padding: 18px 10px;
      font-size: 24px;
      font-weight: bold;
    }


    /* ==========================================
       CONTAINER
    ========================================== */

    .container {
      width: 100%;
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }


    /* ==========================================
       CAMERA
    ========================================== */

    #reader {
      width: 100%;
      margin-top: 20px;
    }


    #reader video {
      width: 100% !important;
      border-radius: 12px;
    }


    /* ==========================================
       STATUS
    ========================================== */

    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #eeeeee;
      font-size: 18px;
      font-weight: bold;
    }


    .success {
      background: #d9ead3;
      color: #166534;
    }


    .error {
      background: #f4cccc;
      color: #990000;
    }


    .processing {
      background: #fff2cc;
      color: #7f6000;
    }


    /* ==========================================
       ORDER
    ========================================== */

    .order {
      font-size: 28px;
      font-weight: bold;
      margin-top: 15px;
      word-break: break-all;
    }


    /* ==========================================
       STATUS FLOW
    ========================================== */

    .status-flow-box {
      margin-top: 20px;
      padding: 20px;
      border-radius: 15px;
      background: #f5f5f5;
      border: 2px solid #eeeeee;
    }


    .status-label {
      font-size: 14px;
      color: #777777;
      font-weight: bold;
      margin-bottom: 10px;
    }


    .status-flow {
      font-size: 25px;
      font-weight: bold;
      line-height: 1.5;
      word-break: break-word;
    }


    .from-status {
      color: #555555;
    }


    .arrow {
      color: #f58220;
      padding: 0 8px;
    }


    .to-status {
      color: #166534;
    }


    /* ==========================================
       INFO
    ========================================== */

    .info-box {
      margin-top: 15px;
      padding: 18px;
      border-radius: 12px;
      background: #ffffff;
      border: 1px solid #dddddd;
      text-align: left;
    }


    .info-row {
      padding: 7px 0;
      border-bottom: 1px solid #eeeeee;
      font-size: 16px;
    }


    .info-row:last-child {
      border-bottom: none;
    }


    .info-label {
      color: #777777;
      font-weight: normal;
    }


    .info-value {
      font-weight: bold;
      color: #222222;
      word-break: break-word;
    }


    /* ==========================================
       BUTTON
    ========================================== */

    button {
      margin-top: 20px;
      width: 100%;
      padding: 17px 25px;
      border: none;
      border-radius: 10px;
      background: #f58220;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }


    button:active {
      transform: scale(0.98);
    }


    button.stop {
      background: #555555;
    }


    button.next {
      background: #111111;
    }


    button:disabled {
      opacity: 0.6;
    }


    /* ==========================================
       RESULT
    ========================================== */

    #result {
      margin-top: 15px;
    }


    .small {
      margin-top: 10px;
      color: #666666;
      font-size: 14px;
    }


    .hidden {
      display: none !important;
    }


    /* ==========================================
       RESULT CARD
    ========================================== */

    .result-card {
      margin-top: 20px;
      padding: 20px;
      background: #f8f8f8;
      border: 2px solid #f58220;
      border-radius: 15px;
      text-align: center;
    }


    .result-title {
      font-size: 22px;
      font-weight: bold;
      color: #166534;
      margin-bottom: 15px;
    }


    .details {
      margin-top: 20px;
      text-align: left;
      background: white;
      border: 1px solid #dddddd;
      border-radius: 10px;
      padding: 15px;
    }


    .detail-row {
      padding: 8px 0;
      border-bottom: 1px solid #eeeeee;
      font-size: 15px;
    }


    .detail-row:last-child {
      border-bottom: none;
    }


    .detail-label {
      color: #777777;
    }


    .detail-value {
      font-weight: bold;
      color: #222222;
      word-break: break-word;
    }


  </style>

</head>


<body>


  <!-- ==========================================
       HEADER
  ========================================== -->

  <div class="header">
    CYFORM PHONE SCANNER
  </div>


  <div class="container">


    <!-- ========================================
         CAMERA
    ======================================== -->

    <div id="reader"></div>


    <!-- ========================================
         STATUS
    ======================================== -->

    <div
      id="status"
      class="status"
    >
      READY TO SCAN
    </div>


    <!-- ========================================
         RESULT
    ======================================== -->

    <div id="result"></div>


    <!-- ========================================
         START CAMERA
    ======================================== -->

    <button
      id="startButton"
      onclick="startScanner()"
    >
      📷 START CAMERA
    </button>


    <!-- ========================================
         NEXT SCAN
    ======================================== -->

    <button
      id="nextButton"
      class="next hidden"
      onclick="startNextScan()"
    >
      🔄 SCAN ORDER SETERUSNYA
    </button>


    <div class="small">
      Scan barcode ORDER ID
    </div>


  </div>


<script>


  // ==================================================
  // GOOGLE APPS SCRIPT BACKEND
  // ==================================================

  const BACKEND_URL =
    "https://script.google.com/macros/s/AKfycbw9smho6W_Qr3jrxHdR_M1faez_FOPkwXTL9UdX7da_WlplzJGIw2uPDIVQRoiF-qIDiQ/exec";


  // ==================================================
  // VARIABLES
  // ==================================================

  let scanner = null;

  let scanning = false;

  let processing = false;

  let backendWindow = null;


  // ==================================================
  // ELEMENTS
  // ==================================================

  const statusElement =
    document.getElementById("status");


  const resultElement =
    document.getElementById("result");


  const startButton =
    document.getElementById("startButton");


  const nextButton =
    document.getElementById("nextButton");


  // ==================================================
  // STATUS
  // ==================================================

  function setStatus(
    message,
    type = ""
  ) {

    statusElement.className =
      "status " + type;


    statusElement.innerHTML =
      message;

  }


  // ==================================================
  // START CAMERA
  // ==================================================

  function startScanner() {


    if (scanning) {
      return;
    }


    if (processing) {
      return;
    }


    processing =
      false;


    resultElement.innerHTML =
      "";


    nextButton.classList.add(
      "hidden"
    );


    startButton.disabled =
      true;


    startButton.innerText =
      "⏳ CAMERA STARTING...";


    startButton.classList.remove(
      "stop"
    );


    setStatus(
      "📷 CAMERA STARTING...",
      "processing"
    );


    // ================================================
    // CREATE SCANNER
    // ================================================

    scanner =
      new Html5Qrcode(
        "reader"
      );


    scanner.start(

      {
        facingMode: "environment"
      },

      {

        fps: 10,


        qrbox:
          function(
            viewfinderWidth,
            viewfinderHeight
          ) {

            return {

              width:
                Math.floor(
                  viewfinderWidth * 0.85
                ),

              height:
                Math.floor(
                  viewfinderHeight * 0.30
                )

            };

          },


        aspectRatio:
          1.7777778

      },

      onScanSuccess,

      onScanFailure

    )


    .then(

      function() {

        scanning =
          true;


        startButton.disabled =
          false;


        startButton.innerText =
          "⏹ STOP CAMERA";


        startButton.classList.add(
          "stop"
        );


        startButton.onclick =
          stopScanner;


        setStatus(
          "📷 CAMERA READY<br>Scan barcode ORDER ID"
        );

      }

    )


    .catch(

      function(error) {

        console.error(
          error
        );


        scanning =
          false;


        processing =
          false;


        startButton.disabled =
          false;


        startButton.innerText =
          "📷 START CAMERA";


        startButton.classList.remove(
          "stop"
        );


        startButton.onclick =
          startScanner;


        setStatus(
          "❌ CAMERA ERROR",
          "error"
        );


        resultElement.innerHTML =

          "<div class='small'>" +

          escapeHtml(
            String(error)
          ) +

          "</div>";

      }

    );

  }


  // ==================================================
  // STOP CAMERA
  // ==================================================

  function stopScanner() {


    if (
      !scanner ||
      !scanning
    ) {

      scanning =
        false;

      return;

    }


    scanner
      .stop()

      .then(

        function() {

          scanning =
            false;


          startButton.disabled =
            false;


          startButton.innerText =
            "📷 START CAMERA";


          startButton.classList.remove(
            "stop"
          );


          startButton.onclick =
            startScanner;


          setStatus(
            "CAMERA STOPPED"
          );

        }

      )

      .catch(

        function(error) {

          console.error(
            error
          );


          scanning =
            false;


          startButton.disabled =
            false;


          startButton.innerText =
            "📷 START CAMERA";


          startButton.classList.remove(
            "stop"
          );


          startButton.onclick =
            startScanner;

        }

      );

  }


  // ==================================================
  // SCAN SUCCESS
  // ==================================================

  function onScanSuccess(
    decodedText,
    decodedResult
  ) {


    // ================================================
    // PREVENT DUPLICATE SCAN
    // ================================================

    if (processing) {
      return;
    }


    processing =
      true;


    // ================================================
    // GET ORDER ID
    // ================================================

    const orderId =
      String(
        decodedText || ""
      ).trim();


    if (!orderId) {

      processing =
        false;

      return;

    }


    console.log(
      "SCANNED ORDER:",
      orderId
    );


    // ================================================
    // SHOW ORDER ID
    // ================================================

    resultElement.innerHTML =

      "<div class='order'>" +

      escapeHtml(
        orderId
      ) +

      "</div>";


    setStatus(
      "⏳ PROCESSING ORDER...",
      "processing"
    );


    // ================================================
    // STOP CAMERA
    // ================================================

    if (
      scanner &&
      scanning
    ) {

      scanner
        .stop()

        .then(

          function() {

            scanning =
              false;

          }

        )

        .catch(

          function(error) {

            console.log(
              error
            );

            scanning =
              false;

          }

        );

    }


    // ================================================
    // SEND TO BACKEND
    // ================================================

    sendToBackend(
      orderId
    );

  }


  // ==================================================
  // SEND ORDER TO BACKEND
  // ==================================================

  function sendToBackend(
    orderId
  ) {


    const url =

      BACKEND_URL +

      "?action=scan&orderId=" +

      encodeURIComponent(
        orderId
      );


    console.log(
      "BACKEND URL:",
      url
    );


    setStatus(
      "⏳ UPDATING DATABASE...",
      "processing"
    );


    /*
     * IMPORTANT
     *
     * Backend hanya dipanggil SEKALI.
     *
     * Jangan buat fetch kedua.
     *
     * Apps Script akan:
     *
     * 1. processScan()
     * 2. update database
     * 3. return fromStatus
     * 4. return toStatus
     * 5. postMessage() ke page ini
     */


    backendWindow =
      window.open(
        url,
        "_blank"
      );


    // ================================================
    // POPUP BLOCKED
    // ================================================

    if (!backendWindow) {

      setStatus(
        "⚠️ POPUP BLOCKED",
        "error"
      );


      resultElement.innerHTML =

        "<div class='small'>" +

        "Browser block popup. " +

        "Allow popup untuk website ini." +

        "</div>";


      processing =
        false;


      return;

    }


    console.log(
      "BACKEND WINDOW OPENED"
    );

  }


  // ==================================================
  // RECEIVE RESULT FROM GOOGLE APPS SCRIPT
  // ==================================================

  window.addEventListener(
    "message",
    function(event) {

      console.log(
        "MESSAGE RECEIVED:",
        event.data
      );


      // ==============================================
      // CHECK MESSAGE TYPE
      // ==============================================

      if (
        !event.data ||
        event.data.type !==
        "CYFORM_SCAN_RESULT"
      ) {

        return;

      }


      const result =
        event.data.payload;


      console.log(
        "REAL BACKEND RESULT:",
        result
      );


      // ==============================================
      // CLOSE BACKEND WINDOW
      // ==============================================

      try {

        if (
          backendWindow &&
          !backendWindow.closed
        ) {

          backendWindow.close();

        }

      }

      catch(error) {

        console.log(
          "Cannot close backend window:",
          error
        );

      }


      backendWindow =
        null;


      // ==============================================
      // CHECK RESULT
      // ==============================================

      if (
        !result ||
        !result.success
      ) {

        setStatus(
          "❌ SCAN FAILED",
          "error"
        );


        resultElement.innerHTML =

          "<div class='result-card'>" +

          "<div " +
          "class='result-title' " +
          "style='color:#990000'>" +

          "❌ SCAN ERROR" +

          "</div>" +


          "<div class='details'>" +

          "<div class='detail-row'>" +

          "<span class='detail-label'>" +

          "MESSAGE: " +

          "</span>" +


          "<span class='detail-value'>" +

          escapeHtml(

            result &&
            result.message

              ? result.message

              : "Unknown error"

          ) +

          "</span>" +

          "</div>" +

          "</div>" +

          "</div>";


        processing =
          false;


        nextButton.classList.remove(
          "hidden"
        );


        return;

      }


      // ==============================================
      // GET REAL BACKEND DATA
      // ==============================================

      const orderId =
        result.orderId ||
        "-";


      const fromStatus =
        result.fromStatus ||
        "-";


      const toStatus =
        result.toStatus ||
        "-";


      const name =
        result.name ||
        "-";


      const sku =
        result.sku ||
        "-";


      const model =
        result.model ||
        "-";


      const source =
        result.source ||
        "-";


      // ==============================================
      // SUCCESS
      // ==============================================

      setStatus(
        "✅ SCAN BERJAYA",
        "success"
      );


      // ==============================================
      // SHOW REAL STATUS
      // ==============================================

      resultElement.innerHTML =

        "<div class='result-card'>" +


        // ==========================================
        // TITLE
        // ==========================================

        "<div class='result-title'>" +

        "✅ STATUS BERJAYA DIUPDATE" +

        "</div>" +


        // ==========================================
        // ORDER ID
        // ==========================================

        "<div class='order'>" +

        escapeHtml(
          orderId
        ) +

        "</div>" +


        // ==========================================
        // STATUS FLOW
        // ==========================================

        "<div class='status-flow-box'>" +

        "<div class='status-label'>" +

        "STATUS BERUBAH" +

        "</div>" +


        "<div class='status-flow'>" +


        "<span class='from-status'>" +

        escapeHtml(
          fromStatus
        ) +

        "</span>" +


        "<span class='arrow'>" +

        "→" +

        "</span>" +


        "<span class='to-status'>" +

        escapeHtml(
          toStatus
        ) +

        "</span>" +


        "</div>" +

        "</div>" +


        // ==========================================
        // DETAILS
        // ==========================================

        "<div class='details'>" +


        "<div class='detail-row'>" +

        "<span class='detail-label'>" +

        "NAME: " +

        "</span>" +

        "<span class='detail-value'>" +

        escapeHtml(
          name
        ) +

        "</span>" +

        "</div>" +


        "<div class='detail-row'>" +

        "<span class='detail-label'>" +

        "SKU: " +

        "</span>" +

        "<span class='detail-value'>" +

        escapeHtml(
          sku
        ) +

        "</span>" +

        "</div>" +


        "<div class='detail-row'>" +

        "<span class='detail-label'>" +

        "MODEL: " +

        "</span>" +

        "<span class='detail-value'>" +

        escapeHtml(
          model
        ) +

        "</span>" +

        "</div>" +


        "<div class='detail-row'>" +

        "<span class='detail-label'>" +

        "SOURCE: " +

        "</span>" +

        "<span class='detail-value'>" +

        escapeHtml(
          source
        ) +

        "</span>" +

        "</div>" +


        "</div>" +


        "</div>";


      // ==============================================
      // SHOW NEXT SCAN BUTTON
      // ==============================================

      nextButton.classList.remove(
        "hidden"
      );


      startButton.classList.add(
        "hidden"
      );


      processing =
        false;

    }
  );


  // ==================================================
  // SCAN FAILURE
  // ==================================================

  function onScanFailure(
    errorMessage
  ) {

    /*
     * Jangan buat apa-apa.
     *
     * html5-qrcode memang akan panggil
     * function ini banyak kali ketika
     * camera sedang mencari barcode.
     */

  }


  // ==================================================
  // NEXT SCAN
  // ==================================================

  function startNextScan() {


    processing =
      false;


    resultElement.innerHTML =
      "";


    nextButton.classList.add(
      "hidden"
    );


    startButton.classList.remove(
      "hidden"
    );


    startButton.disabled =
      false;


    startButton.innerText =
      "📷 START CAMERA";


    startButton.classList.remove(
      "stop"
    );


    startButton.onclick =
      startScanner;


    scanner =
      null;


    setStatus(
      "READY TO SCAN"
    );

  }


  // ==================================================
  // ESCAPE HTML
  // ==================================================

  function escapeHtml(
    text
  ) {

    return String(
      text || ""
    )

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }


</script>


</body>

</html>
