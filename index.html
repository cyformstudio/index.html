<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>CYFORM PHONE SCANNER</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .header {
      background: #f58220;
      color: white;
      padding: 18px 10px;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #eeeeee;
      font-size: 18px;
      font-weight: bold;
    }

    .success {
      background: #d9ead3;
      color: #166534;
    }

    .error {
      background: #f4cccc;
      color: #990000;
    }

    button {
      margin-top: 20px;
      padding: 15px 25px;
      border: none;
      border-radius: 10px;
      background: #f58220;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    .order {
      font-size: 26px;
      margin-top: 10px;
    }

    .arrow {
      font-size: 24px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="header">
    CYFORM PHONE SCANNER
  </div>

  <div class="container">

    <div id="reader"></div>

    <div id="status" class="status">
      READY TO SCAN
    </div>

    <div id="result"></div>

    <button onclick="startScanner()">
      📷 START CAMERA
    </button>

  </div>


<script>

  // ==================================================
  // CYFORM GOOGLE APPS SCRIPT BACKEND
  // ==================================================

  const BACKEND_URL =
    "https://script.google.com/macros/s/AKfycbw9smho6W_Qr3jrxHdR_M1faez_FOPkwXTL9UdX7da_WlplzJGIw2uPDIVQRoiF-qIDiQ/exec";


  // ==================================================
  // VARIABLES
  // ==================================================

  let scanner = null;
  let scanning = false;
  let processing = false;


  // ==================================================
  // START CAMERA
  // ==================================================

  function startScanner() {

    if (scanning) {
      return;
    }

    processing = false;

    document.getElementById("status").className =
      "status";

    document.getElementById("status").innerHTML =
      "📷 CAMERA STARTING...";

    scanner = new Html5Qrcode("reader");

    scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: function(viewfinderWidth, viewfinderHeight) {

          return {
            width: Math.floor(viewfinderWidth * 0.85),
            height: Math.floor(viewfinderHeight * 0.30)
          };

        },

        aspectRatio: 1.7777778

      },

      onScanSuccess,

      onScanFailure

    )
    .then(function() {

      scanning = true;

      document.getElementById("status")
        .innerHTML =
        "📷 CAMERA READY<br>Scan barcode ORDER ID";

    })
    .catch(function(error) {

      document.getElementById("status")
        .className =
        "status error";

      document.getElementById("status")
        .innerHTML =
        "❌ CAMERA ERROR<br>" +
        error;

    });

  }


  // ==================================================
  // SCAN SUCCESS
  // ==================================================

  function onScanSuccess(decodedText, decodedResult) {

    if (processing) {
      return;
    }

    processing = true;

    const orderId =
      String(decodedText).trim();


    // Stop camera temporarily

    if (scanner && scanning) {

      scanner.stop()
        .then(function() {

          scanning = false;

        })
        .catch(function() {

          scanning = false;

        });

    }


    document.getElementById("status")
      .className =
      "status";

    document.getElementById("status")
      .innerHTML =
      "⏳ SCANNING...";


    document.getElementById("result")
      .innerHTML =
      "<div class='order'>" +
      orderId +
      "</div>";


    // ==================================================
    // SEND TO GOOGLE SHEET
    // ==================================================

    const url =
      BACKEND_URL +
      "?action=scan&orderId=" +
      encodeURIComponent(orderId);


    // Navigate to backend

    window.location.href = url;

  }


  // ==================================================
  // SCAN FAILURE
  // ==================================================

  function onScanFailure(error) {

    // Ignore normal camera frames
    // until barcode is detected.

  }

</script>

</body>
</html>
