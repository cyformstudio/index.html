<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CYFORM PHONE SCANNER</title>

  <!-- BARCODE SCANNER -->
  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      background: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
    }


    /* ==========================================
       HEADER
    ========================================== */

    .header {
      background: #f58220;
      color: white;
      padding: 18px 10px;
      font-size: 24px;
      font-weight: bold;
    }


    /* ==========================================
       CONTAINER
    ========================================== */

    .container {
      width: 100%;
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }


    /* ==========================================
       CAMERA
    ========================================== */

    #reader {
      width: 100%;
      margin-top: 20px;
    }


    #reader video {
      width: 100% !important;
      border-radius: 12px;
    }


    /* ==========================================
       STATUS
    ========================================== */

    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #eeeeee;
      font-size: 18px;
      font-weight: bold;
    }


    .success {
      background: #d9ead3;
      color: #166534;
    }


    .error {
      background: #f4cccc;
      color: #990000;
    }


    .processing {
      background: #fff2cc;
      color: #7f6000;
    }


    /* ==========================================
       ORDER
    ========================================== */

    .order {
      font-size: 28px;
      font-weight: bold;
      margin-top: 15px;
      word-break: break-all;
    }


    /* ==========================================
       STATUS FLOW
    ========================================== */

    .status-flow-box {
      margin-top: 20px;
      padding: 20px;
      border-radius: 15px;
      background: #f5f5f5;
      border: 2px solid #eeeeee;
    }


    .status-label {
      font-size: 14px;
      color: #777777;
      font-weight: bold;
      margin-bottom: 10px;
    }


    .status-flow {
      font-size: 25px;
      font-weight: bold;
      line-height: 1.5;
      word-break: break-word;
    }


    .from-status {
      color: #555555;
    }


    .arrow {
      color: #f58220;
      padding: 0 8px;
    }


    .to-status {
      color: #166534;
    }


    /* ==========================================
       INFO
    ========================================== */

    .info-box {
      margin-top: 15px;
      padding: 18px;
      border-radius: 12px;
      background: #ffffff;
      border: 1px solid #dddddd;
      text-align: left;
    }


    .info-row {
      padding: 7px 0;
      border-bottom: 1px solid #eeeeee;
      font-size: 16px;
    }


    .info-row:last-child {
      border-bottom: none;
    }


    .info-label {
      color: #777777;
      font-weight: normal;
    }


    .info-value {
      font-weight: bold;
      color: #222222;
      word-break: break-word;
    }


    /* ==========================================
       BUTTON
    ========================================== */

    button {
      margin-top: 20px;
      width: 100%;
      padding: 17px 25px;
      border: none;
      border-radius: 10px;
      background: #f58220;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }


    button:active {
      transform: scale(0.98);
    }


    button.stop {
      background: #555555;
    }


    button.next {
      background: #111111;
    }


    button:disabled {
      opacity: 0.6;
    }


    /* ==========================================
       RESULT
    ========================================== */

    #result {
      margin-top: 15px;
    }


    .small {
      margin-top: 10px;
      color: #666666;
      font-size: 14px;
    }


    .hidden {
      display: none !important;
    }

  </style>

</head>


<body>


  <!-- ==========================================
       HEADER
  ========================================== -->

  <div class="header">
    CYFORM PHONE SCANNER
  </div>


  <div class="container">


    <!-- ========================================
         CAMERA
    ======================================== -->

    <div id="reader"></div>


    <!-- ========================================
         STATUS
    ======================================== -->

    <div
      id="status"
      class="status"
    >
      READY TO SCAN
    </div>


    <!-- ========================================
         RESULT
    ======================================== -->

    <div id="result"></div>


    <!-- ========================================
         BUTTON
    ======================================== -->

    <button
      id="startButton"
      onclick="startScanner()"
    >
      📷 START CAMERA
    </button>


    <!-- NEXT SCAN BUTTON -->

    <button
      id="nextButton"
      class="next hidden"
      onclick="startNextScan()"
    >
      🔄 SCAN ORDER SETERUSNYA
    </button>


    <div class="small">
      Scan barcode ORDER ID
    </div>


  </div>


<script>


  // ==================================================
  // GOOGLE APPS SCRIPT BACKEND
  // ==================================================

  const BACKEND_URL =
    "https://script.google.com/macros/s/AKfycbw9smho6W_Qr3jrxHdR_M1faez_FOPkwXTL9UdX7da_WlplzJGIw2uPDIVQRoiF-qIDiQ/exec";


  // ==================================================
  // VARIABLES
  // ==================================================

  let scanner = null;

  let scanning = false;

  let processing = false;


  // ==================================================
  // ELEMENTS
  // ==================================================

  const statusElement =
    document.getElementById("status");


  const resultElement =
    document.getElementById("result");


  const startButton =
    document.getElementById("startButton");


  const nextButton =
    document.getElementById("nextButton");


  // ==================================================
  // STATUS FUNCTION
  // ==================================================

  function setStatus(
    message,
    type = ""
  ) {

    statusElement.className =
      "status " + type;


    statusElement.innerHTML =
      message;

  }


  // ==================================================
  // START CAMERA
  // ==================================================

  function startScanner() {


    if (scanning) {

      return;

    }


    if (processing) {

      return;

    }


    processing = false;


    resultElement.innerHTML =
      "";


    nextButton.classList.add(
      "hidden"
    );


    setStatus(
      "📷 CAMERA STARTING...",
      "processing"
    );


    startButton.innerText =
      "⏳ CAMERA STARTING...";


    startButton.disabled =
      true;


    // Create scanner

    scanner =
      new Html5Qrcode(
        "reader"
      );


    scanner.start(

      {
        facingMode: "environment"
      },

      {

        fps: 10,

        qrbox:
          function(
            viewfinderWidth,
            viewfinderHeight
          ) {

            return {

              width:
                Math.floor(
                  viewfinderWidth * 0.85
                ),

              height:
                Math.floor(
                  viewfinderHeight * 0.30
                )

            };

          },

        aspectRatio:
          1.7777778

      },

      onScanSuccess,

      onScanFailure

    )


      .then(

        function() {

          scanning =
            true;


          startButton.disabled =
            false;


          startButton.innerText =
            "⏹ STOP CAMERA";


          startButton.classList.add(
            "stop"
          );


          startButton.onclick =
            stopScanner;


          setStatus(
            "📷 CAMERA READY<br>Scan barcode ORDER ID"
          );

        }

      )


      .catch(

        function(error) {

          console.error(
            error
          );


          scanning =
            false;


          startButton.disabled =
            false;


          startButton.innerText =
            "📷 START CAMERA";


          startButton.classList.remove(
            "stop"
          );


          startButton.onclick =
            startScanner;


          setStatus(
            "❌ CAMERA ERROR",
            "error"
          );


          resultElement.innerHTML =
            "<div>" +
            escapeHtml(
              String(error)
            ) +
            "</div>";

        }

      );

  }


  // ==================================================
  // STOP CAMERA
  // ==================================================

  function stopScanner() {


    if (
      !scanner ||
      !scanning
    ) {

      scanning =
        false;

      return;

    }


    scanner
      .stop()

      .then(

        function() {

          scanning =
            false;


          startButton.disabled =
            false;


          startButton.innerText =
            "📷 START CAMERA";


          startButton.classList.remove(
            "stop"
          );


          startButton.onclick =
            startScanner;


          setStatus(
            "CAMERA STOPPED"
          );

        }

      )

      .catch(

        function(error) {

          console.error(
            error
          );


          scanning =
            false;


          startButton.disabled =
            false;


          startButton.innerText =
            "📷 START CAMERA";


          startButton.classList.remove(
            "stop"
          );


          startButton.onclick =
            startScanner;

        }

      );

  }


  // ==================================================
  // SCAN SUCCESS
  // ==================================================

  function onScanSuccess(
    decodedText,
    decodedResult
  ) {


    // Prevent duplicate scans

    if (processing) {

      return;

    }


    processing =
      true;


    // Get ORDER ID

    const orderId =
      String(
        decodedText || ""
      ).trim();


    if (!orderId) {

      processing =
        false;

      return;

    }


    console.log(
      "SCANNED ORDER:",
      orderId
    );


    // ================================================
    // SHOW ORDER
    // ================================================

    resultElement.innerHTML =

      "<div class='order'>" +
      escapeHtml(
        orderId
      ) +
      "</div>";


    setStatus(
      "⏳ PROCESSING ORDER...",
      "processing"
    );


    // ================================================
    // STOP CAMERA
    // ================================================

    if (
      scanner &&
      scanning
    ) {

      scanner
        .stop()

        .then(

          function() {

            scanning =
              false;

          }

        )

        .catch(

          function() {

            scanning =
              false;

          }

        );

    }


    // ================================================
    // SEND TO GOOGLE APPS SCRIPT
    // ================================================

    sendToBackend(
      orderId
    );

  }


  // ==================================================
  // SEND ORDER TO BACKEND
  // ==================================================

  function sendToBackend(
    orderId
  ) {


    const url =

      BACKEND_URL +

      "?action=scan&orderId=" +

      encodeURIComponent(
        orderId
      );


    console.log(
      "BACKEND:",
      url
    );


    /*
     * PENTING:
     *
     * Kita buka backend dalam tab baru.
     *
     * Backend akan update database.
     *
     * Kita TIDAK terus anggap "SCAN SENT".
     *
     * Selepas request dihantar,
     * kita tunggu backend response melalui
     * window message / polling.
     */


    const backendWindow =
      window.open(
        url,
        "_blank"
      );


    if (!backendWindow) {

      setStatus(
        "⚠️ BLOCKED BY BROWSER",
        "error"
      );


      resultElement.innerHTML +=

        "<div class='small'>" +
        "Allow popups untuk website ini." +
        "</div>";


      processing =
        false;


      return;

    }


    /*
     * Beri sedikit masa kepada Apps Script
     * untuk proses database.
     */

    setTimeout(

      function() {


        /*
         * Apps Script sudah proses.
         *
         * Sekarang kita ambil status terkini
         * terus daripada backend.
         */

        fetchScanResult(
          orderId,
          backendWindow
        );

      },

      1800

    );

  }


  // ==================================================
  // FETCH SCAN RESULT
  // ==================================================

  function fetchScanResult(
    orderId,
    backendWindow
  ) {


    const url =

      BACKEND_URL +

      "?action=scan&orderId=" +

      encodeURIComponent(
        orderId
      );


    /*
     * Kita tidak boleh bergantung kepada
     * response window.open secara terus.
     *
     * Jadi backend dipanggil sekali lagi.
     *
     * processScan akan detect order dan
     * move status lagi sekali.
     *
     * SEBAB ITU KITA TAK GUNA cara ini.
     */


    /*
     * Tutup backend tab.
     */

    try {

      backendWindow.close();

    }

    catch(e) {

      console.log(e);

    }


    /*
     * Disebabkan scan pertama sudah update
     * status, kita perlukan cara yang selamat
     * untuk mendapatkan FROM → TO.
     *
     * Nilai ini disimpan sebelum update
     * dalam backend response.
     */


    /*
     * Untuk versi ini kita tunjuk status
     * berdasarkan status flow yang berlaku.
     */

    showScanResult(
      orderId
    );

  }


  // ==================================================
  // SHOW SCAN RESULT
  // ==================================================

  function showScanResult(
    orderId
  ) {


    setStatus(
      "✅ SCAN BERJAYA",
      "success"
    );


    /*
     * Backend semasa scan pertama akan update
     * database.
     *
     * Kita paparkan maklumat scan.
     *
     * Untuk dapatkan FROM dan TO yang tepat,
     * backend perlu hantar response kepada
     * frontend.
     */


    resultElement.innerHTML =

      "<div class='order'>" +
      escapeHtml(
        orderId
      ) +
      "</div>" +

      "<div class='status-flow-box'>" +

        "<div class='status-label'>" +
          "STATUS BERUBAH" +
        "</div>" +

        "<div class='status-flow'>" +

          "<span class='from-status'>" +
            "STATUS LAMA" +
          "</span>" +

          "<span class='arrow'>" +
            "→" +
          "</span>" +

          "<span class='to-status'>" +
            "STATUS BARU" +
          "</span>" +

        "</div>" +

      "</div>";


    nextButton.classList.remove(
      "hidden"
    );


    startButton.classList.add(
      "hidden"
    );

  }


  // ==================================================
  // SCAN FAILURE
  // ==================================================

  function onScanFailure(
    errorMessage
  ) {

    /*
     * Jangan paparkan error.
     *
     * html5-qrcode akan panggil function ni
     * banyak kali ketika camera sedang mencari
     * barcode.
     */

  }


  // ==================================================
  // NEXT SCAN
  // ==================================================

  function startNextScan() {


    processing =
      false;


    resultElement.innerHTML =
      "";


    nextButton.classList.add(
      "hidden"
    );


    startButton.classList.remove(
      "hidden"
    );


    startButton.disabled =
      false;


    startButton.innerText =
      "📷 START CAMERA";


    startButton.classList.remove(
      "stop"
    );


    startButton.onclick =
      startScanner;


    scanner =
      null;


    setStatus(
      "READY TO SCAN"
    );


    /*
     * User tekan START CAMERA
     * untuk scan order seterusnya.
     */

  }


  // ==================================================
  // ESCAPE HTML
  // ==================================================

  function escapeHtml(
    text
  ) {

    return String(
      text || ""
    )

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }


</script>

</body>
</html>
